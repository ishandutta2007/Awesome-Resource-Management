<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <linearGradient id="mesh-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#a78bfa" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="bar-fill-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="bar-fill-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="bar-fill-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }

    @keyframes barPulse1 {
      0%, 100% { width: 140px; }
      50% { width: 175px; }
    }

    @keyframes barPulse2 {
      0%, 100% { width: 110px; }
      50% { width: 145px; }
    }

    @keyframes barPulse3 {
      0%, 100% { width: 160px; }
      50% { width: 185px; }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatPill {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(0.5deg); }
    }

    .pulsing-glow {
      transform-origin: center;
      animation: pulseGlow 7s ease-in-out infinite alternate;
    }

    .moving-dash {
      stroke-dasharray: 6 6;
      animation: dashMove 14s linear infinite;
    }

    .anim-bar-1 { animation: barPulse1 6s ease-in-out infinite; }
    .anim-bar-2 { animation: barPulse2 5s ease-in-out infinite 1s; }
    .anim-bar-3 { animation: barPulse3 7s ease-in-out infinite 2s; }
    .floating-card-anim { animation: floatCard 6s ease-in-out infinite; }
    .floating-pill-anim { animation: floatPill 5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Ambient Glows -->
  <circle cx="240" cy="140" r="280" fill="url(#glow-cyan)" class="pulsing-glow" />
  <circle cx="980" cy="240" r="320" fill="url(#glow-purple)" class="pulsing-glow" style="animation-delay: -3s;" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300 M 0,360 L 1200,360" />
    <path d="M 120,0 L 120,420 M 240,0 L 240,420 M 360,0 L 360,420 M 480,0 L 480,420 M 600,0 L 600,420 M 720,0 L 720,420 M 840,0 L 840,420 M 960,0 L 960,420 M 1080,0 L 1080,420" />
  </g>

  <!-- Flow & Capacity Allocation Curves (Dynamic Visual Element in Background) -->
  <g fill="none" opacity="0.25">
    <path d="M 50,340 C 300,310 400,380 650,330 C 900,280 1000,360 1150,310" stroke="#38bdf8" stroke-width="2" class="moving-dash" />
    <path d="M 80,370 C 350,330 450,400 750,350 C 950,300 1050,390 1180,340" stroke="#a855f7" stroke-width="2" class="moving-dash" style="animation-duration: 20s;" />
  </g>

  <!-- Right Side Interactive Capacity Dashboard Widget (Dynamic Cards) -->
  <g class="floating-card-anim" transform="translate(820, 50)" filter="url(#card-shadow)">
    <!-- Main Card Body -->
    <rect width="320" height="230" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Card Header -->
    <circle cx="28" cy="30" r="5" fill="#ef4444" />
    <circle cx="44" cy="30" r="5" fill="#eab308" />
    <circle cx="60" cy="30" r="5" fill="#22c55e" />
    <text x="86" y="34" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">CAPACITY HEATMAP</text>
    <rect x="238" y="20" width="62" height="20" rx="10" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="0.8" />
    <text x="248" y="34" fill="#38bdf8" font-size="10" font-weight="700" class="font-sans">LIVE • 92%</text>

    <!-- Allocation Item 1: Engineering -->
    <g transform="translate(24, 62)">
      <text x="0" y="14" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Engineering</text>
      <text x="230" y="14" fill="#38bdf8" font-size="12" font-weight="700" class="font-sans">94%</text>
      <!-- Track -->
      <rect x="0" y="22" width="270" height="8" rx="4" fill="#1e293b" />
      <!-- Animated Bar -->
      <rect x="0" y="22" width="165" height="8" rx="4" fill="url(#bar-fill-1)" class="anim-bar-1" />
    </g>

    <!-- Allocation Item 2: Product & Design -->
    <g transform="translate(24, 114)">
      <text x="0" y="14" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Product &amp; Design</text>
      <text x="230" y="14" fill="#c084fc" font-size="12" font-weight="700" class="font-sans">78%</text>
      <!-- Track -->
      <rect x="0" y="22" width="270" height="8" rx="4" fill="#1e293b" />
      <!-- Animated Bar -->
      <rect x="0" y="22" width="130" height="8" rx="4" fill="url(#bar-fill-2)" class="anim-bar-2" />
    </g>

    <!-- Allocation Item 3: Operations & Consulting -->
    <g transform="translate(24, 166)">
      <text x="0" y="14" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Consulting &amp; Delivery</text>
      <text x="230" y="14" fill="#34d399" font-size="12" font-weight="700" class="font-sans">86%</text>
      <!-- Track -->
      <rect x="0" y="22" width="270" height="8" rx="4" fill="#1e293b" />
      <!-- Animated Bar -->
      <rect x="0" y="22" width="175" height="8" rx="4" fill="url(#bar-fill-3)" class="anim-bar-3" />
    </g>
  </g>

  <!-- Floating Meta Badge Pill 1 (Below Widget) -->
  <g class="floating-pill-anim" transform="translate(860, 304)">
    <rect width="250" height="38" rx="19" fill="#0f172a" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.2" filter="url(#card-shadow)" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="36" y="24" fill="#f8fafc" font-size="12" font-weight="600" class="font-sans">⚡ Demand Forecasting &amp; Bench</text>
  </g>

  <!-- ======================================================== -->
  <!-- FOREGROUND HERO CONTENT (GUARANTEED CRISP & UNOBSTRUCTED) -->
  <!-- ======================================================== -->
  <g transform="translate(70, 70)">
    
    <!-- Top Category Tag / Eyebrow -->
    <g transform="translate(0, 0)">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <!-- Glowing dot -->
      <circle cx="18" cy="16" r="4" fill="#38bdf8" />
      <text x="32" y="21" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2" class="font-sans">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title: Awesome Resource Management -->
    <text x="0" y="85" fill="url(#title-grad)" font-size="44" font-weight="900" letter-spacing="-1" class="font-sans" filter="drop-shadow(0 4px 16px rgba(56, 189, 248, 0.25))">
      Awesome Resource Management
    </text>

    <!-- Subtitle: Capacity Planning, Resource Scheduling & Utilization -->
    <text x="0" y="128" fill="#e2e8f0" font-size="19" font-weight="500" class="font-sans">
      Master Capacity Planning, Resource Scheduling &amp; Workload Optimization
    </text>
    <text x="0" y="156" fill="#94a3b8" font-size="15" font-weight="400" class="font-sans">
      The ultimate guide to SaaS platforms, open-source projects, pricing intelligence &amp; market dynamics.
    </text>

    <!-- Feature Attribute Badges / Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="18" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">📊 Capacity Heatmaps</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="18" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">👥 Skill &amp; Bench Planning</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(384, 0)">
        <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="18" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">💰 Pricing &amp; Tier Limits</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(576, 0)">
        <rect width="170" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="18" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">💻 Open-Source Stacks</text>
      </g>
    </g>

    <!-- Bottom Indicator Line -->
    <g transform="translate(0, 260)">
      <circle cx="6" cy="6" r="4" fill="#22c55e" />
      <text x="20" y="10" fill="#cbd5e1" font-size="12" font-weight="500" class="font-sans">
        Verified SaaS Pricing &amp; Free Tier Limits • Real-Time GitHub Stars • Production Ready
      </text>
    </g>

  </g>

</svg>
